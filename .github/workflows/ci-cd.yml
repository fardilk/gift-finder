name: CI/CD - GiftFinder Frontend

on:
  push:
    branches:
      - dev
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: giftfinder-fe
  # 🔹 Env khusus FE yang akan diteruskan ke Docker build
  VITE_API_BASE_URL: ${{ github.ref_name == 'dev' && 'http://103.179.57.4:8082' || 'https://api.giftfinder.com' }}
  VITE_APP_ENV: ${{ github.ref_name == 'dev' && 'stag' || 'prod' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 🏗️ Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          file: ./Dockerfile
          build-args: |
            MODE=${{ github.ref_name }}
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_APP_ENV=${{ env.VITE_APP_ENV }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  deploy:
    name: 🚀 Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy Docker Container to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "➡️ Pulling latest image for ${{ github.ref_name }}..."
            docker pull ghcr.io/${{ github.repository_owner }}/giftfinder-fe:${{ github.ref_name }}

            if [ "${{ github.ref_name }}" = "dev" ]; then
              CONTAINER_NAME=giftfinder_fe_dev
              PORT=5173
            else
              CONTAINER_NAME=giftfinder_fe_prod
              PORT=8080
            fi

            echo "🛑 Stopping old container if exists..."
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            echo "🚢 Starting new container..."
            docker run -d \
              --name $CONTAINER_NAME \
              -p $PORT:80 \
              ghcr.io/${{ github.repository_owner }}/giftfinder-fe:${{ github.ref_name }}

            echo "✅ Deployment for ${{ github.ref_name }} completed on port $PORT"
